name: CI/CD Portfolio
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version de l'image (ex: v1, v2)"
        required: false
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-nextjs

jobs:
  build-and-publish:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calculer la version
        id: ver
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ($v -ne "") { $TAG = $v } else { $TAG = "v${{ github.run_number }}" }
          "tag=$TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Build Next.js
        run: |
          npm install
          npm run build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        run: |
          docker build -t "${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}" -t "${{ env.IMAGE_NAME }}:latest" .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push "${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push "${{ env.IMAGE_NAME }}:latest"
          if ($LASTEXITCODE -ne 0) { exit 1 }

  deploy-local:
    needs: build-and-publish
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Déployer avec Docker Compose
        env:
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.tag }}
        run: |
          docker compose pull
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Vérification de santé
        run: |
          for ($i = 0; $i -lt 15; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:3005" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) {
                Write-Host "Application disponible : http://localhost:3005"
                exit 0
              }
            } catch { }
            Start-Sleep -Seconds 3
          }
          Write-Host "Echec du health check"
          docker compose logs
          exit 1
